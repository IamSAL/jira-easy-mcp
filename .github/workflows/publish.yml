name: Publish to npm and MCP Registry

# Publishes when a GitHub Release is published (tag vX.Y.Z matching package.json).
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret is stored. The package
# must list this repository and workflow file as a trusted publisher on npmjs.com.
on:
  release:
    types: [published]

permissions:
  id-token: write # mint the OIDC token npm exchanges for publish rights
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11, which supports trusted publishing
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11 # trusted publishing needs npm >= 11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Release tag must match package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json $version"; exit 1
          fi
          for v in "v$(node -p "require('./server.json').version")" "v$(node -p "require('./server.json').packages[0].version")"; do
            if [ "$v" != "$version" ]; then echo "server.json version $v does not match package.json $version"; exit 1; fi
          done
      - run: pnpm run lint
      - run: pnpm test
      - name: MCP stdio smoke test
        run: node scripts/smoke.mjs
        env:
          JIRA_BASE_URL: http://127.0.0.1:9
          JIRA_USERNAME: ci
          JIRA_PASSWORD: ci
      # npm silently drops invalid package.json entries (it once dropped `bin`,
      # which would break `npx jira-easy-mcp`); fail instead
      - name: Package check
        run: |
          npm publish --dry-run --provenance=false 2>&1 | tee publish-check.log
          if grep -q "invalid and removed" publish-check.log; then exit 1; fi
      - run: npm publish --provenance --access public
      # Official MCP Registry (registry.modelcontextprotocol.io), from server.json.
      # GitHub OIDC proves ownership of the io.github.IamSAL namespace.
      - name: Publish to MCP Registry
        run: |
          curl -sSfL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
